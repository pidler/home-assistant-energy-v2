input_boolean:
  energy_v2_enabled:
    name: ENERGY V2 povolen
    initial: false

  energy_v2_shadow_mode:
    name: ENERGY V2 shadow rezim
    initial: true

  energy_v2_export_enabled:
    name: ENERGY V2 export povolen
    initial: false

  energy_v2_service_mode:
    name: ENERGY V2 servisni rezim
    initial: false

  energy_v2_safe_to_enable:
    name: ENERGY V2 bezpecne povolit
    initial: false

  energy_v2_charge_shadow_enabled:
    name: ENERGY V2 DEYE charge shadow povolen
    initial: false

  energy_v2_control_shadow_enabled:
    name: ENERGY V2 Phase 4 control shadow povolen
    initial: false

input_select:
  energy_v2_strategy:
    name: ENERGY V2 strategie
    options:
      - SUMMER_NO_GRID_CHARGE
      - WINTER_GRID_OPTIMIZATION
      - SERVICE
    initial: SUMMER_NO_GRID_CHARGE

  energy_v2_requested_mode:
    name: ENERGY V2 pozadovany rezim
    options:
      - DISABLED
      - IDLE
      - PV_CHARGE_DEYE
      - EXPORT_DEYE
      - EXPORT_SOLAX
      - FAULT
      - SERVICE
    initial: DISABLED

  energy_v2_actual_mode:
    name: ENERGY V2 skutecny rezim
    options:
      - DISABLED
      - IDLE
      - TRANSITION
      - PV_CHARGE_DEYE
      - EXPORT_DEYE
      - EXPORT_SOLAX
      - FAULT
      - SERVICE
    initial: DISABLED

  energy_v2_app_status:
    name: ENERGY V2 stav aplikace
    options:
      - STARTING
      - HEALTHY
      - DEGRADED
      - CONFIG_ERROR
    initial: STARTING

  energy_v2_flow_state:
    name: ENERGY V2 stav toku
    options:
      - UNKNOWN
      - NORMAL
      - GRID_IMPORT
      - GRID_EXPORT
      - LIKELY_PV_SURPLUS_CHARGE
      - SOLAX_TO_DEYE
      - DEYE_TO_SOLAX
      - CROSS_CHARGING
      - AMBIGUOUS
    initial: UNKNOWN

  energy_v2_export_limit_state:
    name: ENERGY V2 stav exportniho limitu
    options:
      - UNKNOWN
      - EXPORT_WITHIN_TARGET
      - EXPORT_INSTANT_ABOVE_TARGET
      - EXPORT_AVERAGE_NEAR_LIMIT
      - EXPORT_AVERAGE_LIMIT_VIOLATION
    initial: UNKNOWN

  energy_v2_charge_shadow_state:
    name: ENERGY V2 DEYE charge shadow stav
    options: [DISABLED, WAITING_FOR_SOLAX, START_CONFIRMATION, CHARGE_DEYE_FULL, TRANSFER_CONFIRMATION, CHARGE_DEYE_LIMITED, RETURN_CONFIRMATION, SOLAX_PRIORITY, FAULT]
    initial: DISABLED

  energy_v2_charge_recommended_state:
    name: ENERGY V2 DEYE charge doporuceny stav
    options: [DISABLED, WAITING_FOR_SOLAX, START_CONFIRMATION, CHARGE_DEYE_FULL, TRANSFER_CONFIRMATION, CHARGE_DEYE_LIMITED, RETURN_CONFIRMATION, SOLAX_PRIORITY, FAULT]
    initial: DISABLED

  energy_v2_charge_conflict_state:
    name: ENERGY V2 DEYE charge stav shody rezimu
    options: [MATCHED, WOULD_CORRECT, WOULD_ENTER_FAULT, UNAVAILABLE]
    initial: UNAVAILABLE

  energy_v2_load_quality:
    name: ENERGY V2 kvalita odhadu spotreby
    options: [VALID, STALE, MISSING, INVALID, SKEWED]
    initial: MISSING

  energy_v2_anti_transfer_state:
    name: ENERGY V2 anti-transfer stav
    options: [CLEAR, UNVERIFIED, FAULT]
    initial: UNVERIFIED

  energy_v2_command_status:
    name: ENERGY V2 shadow command stav
    options: [READY, SATURATED, BLOCKED, EXPIRED, BREAK_BEFORE_MAKE, FAULT]
    initial: BLOCKED

