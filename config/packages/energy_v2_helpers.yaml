input_boolean:
  energy_v2_enabled:
    name: ENERGY V2 povolen
    initial: false

  energy_v2_shadow_mode:
    name: ENERGY V2 shadow rezim
    initial: true

  energy_v2_export_enabled:
    name: ENERGY V2 export povolen
    initial: false

  energy_v2_service_mode:
    name: ENERGY V2 servisni rezim
    initial: false

  energy_v2_safe_to_enable:
    name: ENERGY V2 bezpecne povolit
    initial: false

input_select:
  energy_v2_strategy:
    name: ENERGY V2 strategie
    options:
      - SUMMER_NO_GRID_CHARGE
      - WINTER_GRID_OPTIMIZATION
      - SERVICE
    initial: SUMMER_NO_GRID_CHARGE

  energy_v2_requested_mode:
    name: ENERGY V2 pozadovany rezim
    options:
      - DISABLED
      - IDLE
      - PV_CHARGE_DEYE
      - EXPORT_DEYE
      - EXPORT_SOLAX
      - FAULT
      - SERVICE
    initial: DISABLED

  energy_v2_actual_mode:
    name: ENERGY V2 skutecny rezim
    options:
      - DISABLED
      - IDLE
      - TRANSITION
      - PV_CHARGE_DEYE
      - EXPORT_DEYE
      - EXPORT_SOLAX
      - FAULT
      - SERVICE
    initial: DISABLED

  energy_v2_app_status:
    name: ENERGY V2 stav aplikace
    options:
      - STARTING
      - HEALTHY
      - DEGRADED
      - CONFIG_ERROR
    initial: STARTING

  energy_v2_flow_state:
    name: ENERGY V2 stav toku
    options:
      - UNKNOWN
      - NORMAL
      - GRID_IMPORT
      - GRID_EXPORT
      - LIKELY_PV_SURPLUS_CHARGE
      - SOLAX_TO_DEYE
      - DEYE_TO_SOLAX
      - CROSS_CHARGING
      - AMBIGUOUS
    initial: UNKNOWN

  energy_v2_export_limit_state:
    name: ENERGY V2 stav exportniho limitu
    options:
      - UNKNOWN
      - EXPORT_WITHIN_TARGET
      - EXPORT_INSTANT_ABOVE_TARGET
      - EXPORT_AVERAGE_NEAR_LIMIT
      - EXPORT_AVERAGE_LIMIT_VIOLATION
    initial: UNKNOWN

input_number:
  energy_v2_deye_fv_ledger:
    name: ENERGY V2 DEYE FV energie k prodeji
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: kWh
    mode: box
    initial: 0

  energy_v2_solax_fv_ledger:
    name: ENERGY V2 SolaX FV energie k prodeji
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: kWh
    mode: box
    initial: 0

  energy_v2_instant_grid_export_w:
    name: ENERGY V2 okamzity export do site
    min: 0
    max: 30000
    step: 1
    unit_of_measurement: W
    mode: box
    initial: 0

  energy_v2_rolling_15min_export_w:
    name: ENERGY V2 prumerny export 15 min
    min: 0
    max: 30000
    step: 1
    unit_of_measurement: W
    mode: box
    initial: 0

  energy_v2_export_window_covered_s:
    name: ENERGY V2 pokryti exportniho okna
    min: 0
    max: 900
    step: 1
    unit_of_measurement: s
    mode: box
    initial: 0

  energy_v2_export_sample_age_s:
    name: ENERGY V2 stari exportniho vzorku
    min: 0
    max: 3600
    step: 1
    unit_of_measurement: s
    mode: box
    initial: 0

input_text:
  energy_v2_last_fault:
    name: ENERGY V2 posledni chyba
    max: 255

  energy_v2_last_decision:
    name: ENERGY V2 posledni rozhodnuti
    max: 255

  energy_v2_active_conflicts:
    name: ENERGY V2 aktivni konflikty
    max: 255

  energy_v2_last_evaluation_error:
    name: ENERGY V2 posledni chyba vyhodnoceni
    max: 255

  energy_v2_flow_summary:
    name: ENERGY V2 souhrn toku
    max: 255

  energy_v2_flow_warning:
    name: ENERGY V2 varovani toku
    max: 255

  energy_v2_flow_violation:
    name: ENERGY V2 poruseni toku
    max: 255

  energy_v2_export_limit_summary:
    name: ENERGY V2 souhrn exportniho limitu
    max: 255

input_datetime:
  energy_v2_heartbeat:
    name: ENERGY V2 heartbeat
    has_date: true
    has_time: true

  energy_v2_last_successful_evaluation:
    name: ENERGY V2 posledni uspesne vyhodnoceni
    has_date: true
    has_time: true

  energy_v2_last_flow_violation:
    name: ENERGY V2 posledni poruseni toku
    has_date: true
    has_time: true

  energy_v2_last_export_average_violation:
    name: ENERGY V2 posledni prekroceni 15min exportu
    has_date: true
    has_time: true

  energy_v2_last_valid_export_sample:
    name: ENERGY V2 posledni validni exportni vzorek
    has_date: true
    has_time: true
