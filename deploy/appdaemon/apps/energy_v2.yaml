energy_v2:
  module: energy_v2.app
  class: EnergyV2App
  enabled_entity: input_boolean.energy_v2_enabled
  shadow_mode_entity: input_boolean.energy_v2_shadow_mode
  export_enabled_entity: input_boolean.energy_v2_export_enabled
  log_level: INFO
  # Read-only state interpretation; validate timing for the installed inverter.
  deye_state:
    startup_window_s: 300
    ready_confirmation_s: 10
    shutdown_settle_s: 20
    zero_tolerance_w: 10
    feedback_max_age_s: 30
    maximum_skew_s: 20
  solax_rated_power_w: 12000
  solax_battery_capacity_kwh: 24
  solax_min_soc_pct: 10
  deye_rated_power_w: 12000
  deye_battery_capacity_kwh: 32
  deye_min_soc_pct: 10
  target_export_limit_w: 9800
  legal_export_average_limit_w: 10000
  export_average_warning_w: 9800
  export_average_window_s: 900
  export_sample_max_age_s: 120
  flow_tick_interval_s: 5
  shadow_control_interval_s: 5
  shadow_site_target_w: 0
  shadow_slew_limit_w_per_tick: 2000
  shadow_zero_flow_tolerance_w: 300
  shadow_zero_flow_confirmation_s: 10
  solax_fast_power_max_age_s: 60
  deye_fast_power_max_age_s: 30
  fast_input_max_skew_s: 20
  fast_input_coherence_jitter_s: 5
  solax_source_health_window_s: 60
  deye_source_health_window_s: 30
  flow_thresholds:
    grid_import_warning_w: 200
    grid_import_violation_w: 500
    battery_flow_warning_w: 300
    battery_flow_violation_w: 500
    minimum_deye_charge_w: 300
    minimum_export_w: 300
    pv_surplus_reserve_w: 500
    warning_persistence_s: 5
    violation_persistence_s: 10
    telemetry_stale_timeout_s: 30
  deye_max_soc_pct: 90
  solax_pv_charge_start_soc_pct: 95
  pv_reserve_w: 1000
  minimum_sell_price: 3.0
  maximum_future_rank: 12
  charge_shadow:
    start_solax_soc_pct: 90
    stop_solax_soc_pct: 80
    minimum_pv_power_w: 1000
    start_confirmation_s: 30
    maximum_deye_charge_current_a: 240
    solax_priority_deye_current_a: 0
    solax_discharge_tolerance_w: 300
    actual_deye_charge_threshold_w: 300
    transfer_confirmation_s: 10
    transfer_average_window_s: 10
    safe_power_reserve_w: 300
    minimum_safe_deye_charge_power_w: 300
    return_confirmation_s: 30
    conflict_attempt_limit: 3
    conflict_window_s: 60
    fault_recovery_s: 60
  conflicting_automations:
    - automation.fve_solax_zpet_do_self_use_po_vybiti_deye
    - automation.rizeni_solaxu_podle_kalendare_nakup
    - automation.rizeni_solaxu_podle_kalendare_prodej
    - automation.deye_rizeni_baterie_dle_ceny_nabijeni_vybijeni
    - automation.gridcontrol_charge
    - automation.spust_vybijeno_deye_v_konkretni_cas
    - automation.vypne_vybijeni_deye_a_zapne_self_use_mod_na_solaxu
    - automation.zpnout_nabijeni_deye_v_ucity_cas

# Advisory-only, separate from Phase 4. Installation/restart is a future operation.
energy_v2_phase5a_advisory:
  module: energy_v2.advisory_app
  class: Phase5AdvisoryApp
  advisory:
    timezone: Europe/Prague
    minimum_interval_s: 120
    debounce_s: 20
    soc_delta_pct: 3
    load_delta_w: 300
    horizon_refresh_s: 1800
    profile_max_age_s: 21600
    soc_max_age_s: 1800

# Phase 5B observer/publisher only. This app has no inverter control configuration.
energy_v2_phase5b_shadow_executor:
  module: energy_v2.executor_shadow_app
  class: Phase5BShadowExecutorApp
  phase5b_shadow:
    cadence_s: 10
    persistence_path: /config/energy_v2/phase5b_shadow_state.json
    shadow_only: true
    telemetry_max_age_s: 60
    control_max_age_s: 30
    planner_max_age_s: 60
    allow_last_updated_fallback: false
    # Positive capability flags require a separately verified UTC timestamp.
    # Pass 4 defaults remain fail-closed until supervised capability verification.
    capabilities:
      solax_mode1_dispatch_verified: false
      solax_mode5_hold_verified: false
      solax_timeout_verified: false
      deye_start_verified: false
      deye_hold_verified: false
      deye_bounded_export_verified: false
    entity_map:
      solax_soc: sensor.solax_battery_capacity
      solax_battery_power: sensor.solax_battery_power_charge
      solax_inverter_power: sensor.solax_inverter_power
      solax_pv_power: sensor.solax_pv_power_total
      pcc: sensor.solax_measured_power
      solax_charger_mode: select.solax_charger_use_mode
      solax_manual_mode: select.solax_manual_mode_select
      solax_operating_state: sensor.solax_run_mode
      solax_remote_control: sensor.solax_modbus_power_control
      # No independent live SolaX fault source has been verified; fail closed.
      solax_fault: null
      deye_soc: sensor.deye_battery
      # Raw source is normalized in the adapter: positive discharge -> negative.
      deye_battery_power: sensor.deye_battery_power
      deye_inverter_power: sensor.deye_power
      deye_device_state: sensor.deye_device_state
      deye_device_fault: sensor.deye_device_fault
      deye_connection: binary_sensor.deye_connection
      deye_switch: switch.deye
      deye_work_mode: select.deye_work_mode
      deye_time_of_use: select.deye_time_of_use
      deye_export_surplus: switch.deye_export_surplus
      deye_grid_charging: switch.deye_battery_grid_charging
      execution_enabled: input_boolean.energy_v2_control_shadow_enabled
      writer_conflicts: input_text.energy_v2_active_conflicts
      rolling_export_w: input_number.energy_v2_rolling_15min_export_w
      rolling_export_covered_s: input_number.energy_v2_export_window_covered_s
      planner_intent: sensor.energy_v2_phase5a_executor_intent
      planner_status: sensor.energy_v2_phase5a_status
