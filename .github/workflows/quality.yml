name: quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python syntax check
        run: python -m compileall apps tests scripts

      - name: Ruff lint
        run: ruff check apps tests scripts

      - name: Ruff format check
        run: ruff format --check apps tests scripts

      - name: Verify deployment files
        run: python scripts/verify_deployment_files.py

      - name: Verify Home Assistant helper package
        run: python scripts/verify_homeassistant_package.py

      - name: Verify Lovelace dashboard
        run: python scripts/verify_dashboard.py

      - name: Unit and stubbed AppDaemon import tests
        run: pytest
