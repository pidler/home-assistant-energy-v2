name: quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Syntax check
        run: python -m compileall apps tests

      - name: Ruff lint
        run: ruff check apps tests

      - name: Ruff format check
        run: ruff format --check apps tests

      - name: Unit tests
        run: pytest

